<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f6ffd"/>
      <stop offset="100%" stop-color="#2a64fb"/>
    </linearGradient>
    <linearGradient id="bar-yes" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19bf86"/>
      <stop offset="100%" stop-color="#0f9e6b"/>
    </linearGradient>
    <linearGradient id="bar-no" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8495e"/>
      <stop offset="100%" stop-color="#d63049"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#17181e"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#glow)" stroke-width="8" opacity="0.6"/>
  
  <!-- Hash symbol (#) stylized as prediction bars -->
  <!-- Vertical bars (YES green, NO red) -->
  <rect x="168" y="128" width="40" height="256" rx="12" fill="url(#bar-yes)"/>
  <rect x="304" y="128" width="40" height="256" rx="12" fill="url(#bar-no)"/>
  
  <!-- Horizontal bars (purple gradient - the prediction/connection) -->
  <rect x="136" y="196" width="240" height="36" rx="10" fill="url(#glow)"/>
  <rect x="136" y="280" width="240" height="36" rx="10" fill="url(#glow)"/>
  
  <!-- Small diamond accent (decision point) -->
  <g transform="translate(256, 256) rotate(45)">
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#fff" opacity="0.9"/>
  </g>
</svg>
